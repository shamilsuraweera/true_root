name: true_root
description: Supply chain traceability for agricultural products
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  cupertino_icons: ^2.0.0
  qr_flutter: ^4.1.0
  http: ^1.2.1
  mobile_scanner: ^7.5.0
  google_fonts: ^9.0.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#006B5D"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter_native_splash:
  color: "#007E6E"
  image: assets/icon/app_icon_foreground.png
  android: true
  ios: false
  android_12:
    color: "#007E6E"
    image: assets/icon/app_icon_foreground.png
